name: flowraga

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: flowraga
      POSTGRES_USER: flowraga
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowraga -d flowraga"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]

  api:
    build:
      context: ./apps/api
      args:
        INSTALL_MODELS: "true"
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://flowraga:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/flowraga
      CORS_ORIGINS: '["http://localhost:3000"]'
      FASTEMBED_CACHE_PATH: /app/model-cache
    ports:
      - "8000:8000"
    volumes:
      - upload_data:/app/data/uploads
      - model_cache:/app/model-cache
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal, edge]

  worker:
    build:
      context: ./apps/api
      args:
        INSTALL_MODELS: "true"
    command: ["python", "-m", "flowraga.workers.ingestion"]
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://flowraga:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/flowraga
      STORAGE_ROOT: /app/data/uploads
      FASTEMBED_CACHE_PATH: /app/model-cache
    volumes:
      - upload_data:/app/data/uploads
      - model_cache:/app/model-cache
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internal]

  ollama-pull:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    command: ["pull", "${OLLAMA_MODEL:-qwen2.5:3b}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks: [edge]

networks:
  internal:
    internal: true
  edge:

volumes:
  postgres_data:
  upload_data:
  model_cache:
  ollama_data:
