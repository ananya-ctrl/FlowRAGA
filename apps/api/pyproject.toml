[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "flowraga-api"
version = "0.1.0"
description = "FlowRAGA API"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.15,<2",
  "asyncpg>=0.30,<1",
  "boto3>=1.35,<2",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "aiofiles>=24.1,<25",
  "pypdf>=5.4,<6",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "pwdlib[argon2]>=0.2,<1",
  "pyjwt[crypto]>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pgvector>=0.3,<1",
  "prometheus-client>=0.21,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "structlog>=25.1,<26",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
models = ["fastembed>=0.7,<1"]
dev = [
  "aiosqlite>=0.21,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flowraga"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
